<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BarNis | הזמנות מוצרי קוסמטיקה</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <img class="logo" src="logo.png" alt="BarNis" onerror="this.style.display='none'">
      <h1>BarNis Skin Clinic</h1>
      <p class="lead">הזמנת מוצרים מקצועיים לאיסוף מהקליניקה • שליחה מהירה ב-WhatsApp</p>
      <p class="note">אני מאשרת התאמה, זמינות ותשלום לאחר שליחת ההזמנה ✨</p>
    </header>

    <section class="card">
      <h2>פרטי הזמנה</h2>
      <div class="form">
        <label>
          שם מלא
          <input id="customerName" type="text" placeholder="לדוגמה: בר נסימיאן" />
        </label>

        <label>
          טלפון לחזרה
          <input id="customerPhone" type="tel" placeholder="05X-XXXXXXX" />
        </label>

        <label>
          איסוף
          <input type="text" value="איסוף מהקליניקה – מודיעין" disabled />
        </label>

        <label>
          הערות (אופציונלי)
          <textarea id="notes" rows="3" placeholder="סוג עור + מטרה (פיגמנטציה/אקנה/אנטי-אייג׳ינג), רגישויות וכו׳"></textarea>
        </label>
      </div>
    </section>

    <section class="card">
      <div class="row">
        <h2>מוצרים</h2>
        <input id="search" class="search" type="search" placeholder="חיפוש מוצר…" />
      </div>
      <div id="products" class="products"></div>
    </section>

    <section class="card">
      <h2>סיכום הזמנה</h2>
      <div id="cart" class="cart"></div>

      <div class="totalRow">
        <span>סה״כ:</span>
        <strong id="total">₪0</strong>
      </div>

      <button id="sendWA" class="btn" type="button">שליחת הזמנה ב-WhatsApp</button>

      <p class="fineprint">האתר לא מבצע סליקה. לאחר שליחת ההזמנה תקבלי אישור ותשלום מול הקליניקה.</p>
    </section>

    <footer class="footer">
      <small>© BarNis • הזמנה ב-WhatsApp</small>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
